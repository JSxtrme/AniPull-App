# Anipull dev release — GitHub Actions automation (1.9-dev5.4).
# Every push to dev/1.9 (except the workflow's own updates.json
# commit, which carries [skip ci]) builds the signed release APK,
# creates a prerelease with the APK attached, and updates
# updates.json in this repo — so the in-app updater picks the new
# build up with no manual steps. Manual runs via workflow_dispatch.
# Signing: the stable release key lives ONLY in encrypted repo
# secrets (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS,
# KEY_PASSWORD). The workflow decodes it to a temp file, signs,
# verifies the signer fingerprint is the stable key (0b9c4b02...),
# and deletes the temp file afterwards. Secrets are never printed.
# Never touches main, never creates a stable release.
name: Dev release

on:
  push:
    branches: [dev/1.9]
    paths-ignore:
      - updates.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # android-actions/setup-android@v3 fails on this runner: it
      # tries to install the obsolete sdkmanager package 'tools'
      # ("Failed to find package 'tools'", exit code 1). The
      # ubuntu runner already has an Android SDK preinstalled, so
      # use it directly and install only the packages this project
      # needs (platform 37, build-tools 37.0.0, platform-tools).
      # NOTE: the platform package name MUST include the minor
      # version ".0" — "platforms;android-37" does not exist and
      # sdkmanager reports "Failed to find package".
      - name: Set up Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Read version from build.gradle.kts
        id: version
        run: |
          echo "version_code=$(grep -m1 'versionCode =' app/build.gradle.kts | grep -o '[0-9]*')" >> "$GITHUB_OUTPUT"
          echo "version_name=$(grep -m1 'versionName =' app/build.gradle.kts | sed 's/.*"\([^"]*\)".*/\1/')" >> "$GITHUB_OUTPUT"

      - name: Decode keystore
        run: |
          printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/anipull-release.keystore
          chmod 600 /tmp/anipull-release.keystore

      # gradlew loses its execute bit when pushed via the GitHub
      # API, so chmod it here before running it.
      - name: Build release APK
        env:
          ANIPULL_KEYSTORE_FILE: /tmp/anipull-release.keystore
          ANIPULL_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ANIPULL_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ANIPULL_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Verify stable-key signature (fail if not 0b9c4b02...)
        run: |
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | tee /tmp/certs.txt
          grep -qi '0b9c4b025ec68d45da4487711b007d6754b60aa71b12db318e8123b10dd74b18' /tmp/certs.txt

      - name: Compute SHA-256 and publish prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          echo "SHA256=$SHA" >> "$GITHUB_ENV"
          TAG="${{ steps.version.outputs.version_name }}"
          # Idempotent: a re-run deletes a same-tag prerelease first
          # instead of creating a duplicate.
          # gh's "file#name" syntax only sets a label, it does NOT rename
          # the asset — the release asset stayed app-release.apk while
          # updates.json pointed at anipull-$TAG.apk (404). Copy to the
          # wanted filename first, then upload that file plainly.
          cp "$APK" "anipull-$TAG.apk"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            --prerelease \
            --target dev/1.9 \
            --title "$TAG" \
            --notes "1.9-$TAG — dev test build, built and published automatically by GitHub Actions. Signed with the stable release key; updates in place over the previous dev build." \
            "anipull-$TAG.apk"

      - name: Update updates.json and push it back
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - << 'PY'
          import json, os
          # Changelog text comes from release-notes.json at the repo
          # root ({"features": [...], "fixes": [...]}), edited with
          # each dev build. Hardcoding it here meant every build
          # shipped the same stale 5.4 text — the 5.5 sheet would
          # have shown Actions copy instead of its real changes.
          notes = {"features": [], "fixes": []}
          if os.path.exists("release-notes.json"):
              with open("release-notes.json") as f:
                  notes = json.load(f)
                    data = {}
          # Preserve an existing "stable" entry (the 1.9 stable
          # release) so a later dev push does not wipe it from
          # updates.json. The checked-out repo already contains the
          # current updates.json, so read it before overwriting.
          if os.path.exists("updates.json"):
                        try:
                            with open("updates.json") as f:
                                existing = json.load(f)
                        if isinstance(existing, dict) and "stable" in existing:
                            data["stable"] = existing["stable"]
            except Exception:
                pass
          data["dev"] = {
                  "versionCode": int("${{ steps.version.outputs.version_code }}"),
                  "versionName": "${{ steps.version.outputs.version_name }}",
                  "apkUrl": "https://github.com/JSxtrme/AniPull-App/releases/download/${{ steps.version.outputs.version_name }}/anipull-${{ steps.version.outputs.version_name }}.apk",
                  "sha256": "${{ env.SHA256 }}",
                  "features": notes.get("features", []),
                  "fixes": notes.get("fixes", []),
                        }
          with open("updates.json", "w") as f:
              json.dump(data, f, indent=2)
              f.write("\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add updates.json
          git commit -m "[skip ci] updates.json: ${{ steps.version.outputs.version_name }} (versionCode ${{ steps.version.outputs.version_code }})" || echo "nothing to commit"
          git push origin dev/1.9

      - name: Delete temp keystore
        if: always()
        run: rm -f /tmp/anipull-release.keystore /tmp/certs.txt
